[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boundaryloop"
version = "0.1.0"
description = "Human-governed coding agent orchestration with bounded retries and resumable decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "BoundaryLoop contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development"]
dependencies = []

[project.urls]
Repository = "https://github.com/ncusspm25/boundaryloop"
Issues = "https://github.com/ncusspm25/boundaryloop/issues"

[project.scripts]
boundaryloop = "boundaryloop.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "setuptools>=77"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boundaryloop = ["skill/SKILL.md", "skill/references/*.md", "skill/scripts/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src/boundaryloop"]
